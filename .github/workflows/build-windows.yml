name: Build Windows (x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore gnu-sorter-windows.csproj

      - name: Build (x64)
        run: dotnet build gnu-sorter-windows.csproj -c Release -r win-x64 -p:Platform=x64

      - name: Publish (x64, self-contained single-file)
        run: >
          dotnet publish gnu-sorter-windows.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNU-Sorter-Windows-x64
          path: publish/win-x64/*.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/*.exe
          draft: false
          generate_release_notes: false
