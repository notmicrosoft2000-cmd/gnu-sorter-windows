name: Build Windows (x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.402'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Build/publish with MSBuild rather than `dotnet build`/`dotnet publish`.
      # The WinUI XAML compiler (XamlCompiler.exe) is known to fail with a silent
      # "exited with code 1" (MSB3073) on a clean .NET CLI build, while MSBuild
      # succeeds for the same project.
      # https://github.com/microsoft/microsoft-ui-xaml/issues/11183
      - name: Build (x64)
        run: >
          msbuild gnu-sorter-windows.csproj
          /restore /t:Build
          /p:Configuration=Release /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /v:minimal /nologo

      - name: Publish (x64, self-contained single-file)
        run: >
          msbuild gnu-sorter-windows.csproj
          /t:Publish
          /p:Configuration=Release /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true /p:WindowsAppSDKSelfContained=true
          /p:WindowsPackageType=None /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:PublishDir=publish\win-x64\
          /v:minimal /nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNU-Sorter-Windows-x64
          path: publish/win-x64/*.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/*.exe
          draft: false
          generate_release_notes: false
